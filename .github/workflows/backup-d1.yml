name: Encrypted CRM D1 backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CRM_BACKUP_ENCRYPTION_KEY: ${{ secrets.CRM_BACKUP_ENCRYPTION_KEY }}
      CRM_BACKUP_BUCKET: panigale-group-crm-backups-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check backup credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          test -n "$CRM_BACKUP_ENCRYPTION_KEY" || { echo "Missing CRM_BACKUP_ENCRYPTION_KEY repository secret"; exit 1; }
      - name: Export production D1
        run: npx wrangler d1 export panigale-group-crm-production --remote --config wrangler.production.jsonc --output "$RUNNER_TEMP/crm-d1-export.sql" --skip-confirmation
      - name: Encrypt export and remove plaintext
        shell: bash
        run: |
          node scripts/crm-d1-backup.mjs encrypt --input "$RUNNER_TEMP/crm-d1-export.sql" --output "$RUNNER_TEMP/crm-d1-export.sql.enc"
          node scripts/crm-d1-backup.mjs verify --input "$RUNNER_TEMP/crm-d1-export.sql.enc"
          rm -f "$RUNNER_TEMP/crm-d1-export.sql"
      - name: Upload encrypted backup to private R2
        id: upload
        shell: bash
        run: |
          timestamp="$(date -u +'%Y/%m/%d/%H%M%S')"
          object_key="crm-d1/$timestamp-run-${GITHUB_RUN_ID}.sql.enc"
          echo "object_key=$object_key" >> "$GITHUB_OUTPUT"
          npx wrangler r2 object put "$CRM_BACKUP_BUCKET/$object_key" --remote --file "$RUNNER_TEMP/crm-d1-export.sql.enc" --content-type application/octet-stream --content-disposition attachment --force
      - name: Read back and verify encrypted backup
        shell: bash
        run: |
          npx wrangler r2 object get "$CRM_BACKUP_BUCKET/${{ steps.upload.outputs.object_key }}" --remote --file "$RUNNER_TEMP/crm-d1-export-readback.sql.enc"
          node scripts/crm-d1-backup.mjs verify --input "$RUNNER_TEMP/crm-d1-export-readback.sql.enc"
          rm -f "$RUNNER_TEMP/crm-d1-export.sql.enc" "$RUNNER_TEMP/crm-d1-export-readback.sql.enc"
